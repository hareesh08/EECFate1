# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Optimized for 2GB RAM with aggressive GC and performance tuning
org.gradle.jvmargs=-Xmx2048m -Xms512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseCompressedOops -XX:+OptimizeStringConcat -XX:+UseStringDeduplication

# Enable Gradle build cache for faster incremental builds
org.gradle.caching=true

# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable configuration on demand (only configure projects that are needed)
org.gradle.configureondemand=true

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Configure parallel workers (adjust based on CPU cores, typically cores - 1)
org.gradle.workers.max=4

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Enable incremental compilation for Kotlin
kotlin.incremental=true

# Enable Kotlin compiler daemon
kotlin.compiler.execution.strategy=daemon

# Enable non-transitive R classes
# Additional build optimizations
# Enable file system watching for faster incremental builds
org.gradle.vfs.watch=true

# Enable Kotlin incremental annotation processing
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# Optimize Kotlin compilation
kotlin.incremental.usePreciseJavaTracking=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Enable R8 full mode for maximum optimization
android.enableR8=true
android.enableR8.fullMode=true

# Disable unnecessary features for faster builds
# android.enableBuildCache=true
android.enableJetifier=false
android.enableAdditionalTestOutput=false

# Optimize dex compilation
android.enableDexingArtifactTransform=true
android.enableDexingArtifactTransform.desugaring=true

# Use AndroidX
# Disable build features not in use
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Optimize resource processing
android.enableResourceOptimizations=true
